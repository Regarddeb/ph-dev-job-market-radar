name: scrape

# Daily at 01:07 Manila (17:07 UTC). GitHub may start scheduled runs late; the pipeline is
# idempotent, so late, skipped or repeated runs are fine.
on:
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # jobradar_rw role (no DDL)
      SCRAPER_USER_AGENT: ${{ secrets.SCRAPER_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag is published
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock

      - name: Install scraper
        run: uv sync --project scraper --frozen

      - name: Tests (fixtures only)
        run: uv run --project scraper python -m pytest -q

      # ECB reference rates (last 90 days, one request) before the sources, so new postings
      # convert to PHP at today's rate. A failure only leaves PHP amounts NULL; the
      # sources still run, and the job fails at the end.
      - name: Exchange rates (ECB)
        id: fx
        continue-on-error: true
        run: uv run --project scraper python -m scraper.fx

      # One step per source. continue-on-error keeps one broken source from blocking the
      # others; each failure is still recorded in crawl_runs and fails the job at the end.
      - name: Source - remoteok
        id: remoteok
        continue-on-error: true
        run: uv run --project scraper python -m scraper.pipeline --source remoteok

      # Across all sources, after every source has loaded. Only adds duplicates; idempotent.
      - name: Dedupe
        id: dedupe
        continue-on-error: true
        run: uv run --project scraper python -m scraper.dedupe

      # Next (build steps 7 and 10): aggregate.py, retention.py, POST /api/revalidate.

      - name: Fail if any step failed
        if: >-
          steps.fx.outcome == 'failure' || steps.remoteok.outcome == 'failure' ||
          steps.dedupe.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed; see crawl_runs and the step logs."
          exit 1
