[project]
name = "job-radar-scraper"
version = "0.1.0"
description = "Daily rule-based scraper for the PH Dev Job Market Radar (no LLMs)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.28",
    "lxml>=5.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Not an installable package: run modules from the repo root, e.g.
#   uv run --project scraper python -m scraper.pipeline --source remotive --dry-run
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repo root importable so tests use `import scraper.x`.
# importlib mode keeps scraper/ itself off sys.path (scraper/http.py would shadow stdlib `http`).
pythonpath = [".."]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["scraper"]
